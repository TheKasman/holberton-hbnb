<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../static/styles.css">
</head>
<body>
    <!-- ── HEADER ── -->
    <header>
        <a href="index.html">
            <img src="../static/images/logo.png" alt="HBnB Logo" class="logo">
        </a>
        <nav>
            <a href="index.html" class="login-button" style="background-color: var(--lego-blue); border-bottom-color: #004a80;">Home</a>
            <a href="login.html" id="login-link" class="login-button">Login</a>
        </nav>
    </header>
 
    <!-- ── MAIN ── -->
    <main>
        <form id="login-form">
            <h2>Login</h2>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            
            <button type="submit">Login</button>
        </form>
    </main>

    <!-- ── FOOTER ── -->
    <footer>
        <p>&copy; 2026 <strong>HBnB</strong> — All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
