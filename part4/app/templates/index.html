<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Places</title>
    <link rel="stylesheet" href="../static/styles.css">
</head>

<body>
    <!-- ── HEADER ── -->
    <header>
        <a href="index.html">
            <img src="../static/images/logo.png" alt="HBnB Logo" class="logo">
        </a>
        <nav>
            <a href="index.html" class="login-button" style="background-color: var(--lego-blue); border-bottom-color: #004a80;">Home</a>
            <a href="login.html" id="login-link" class="login-button">Login</a>
        </nav>
    </header>

    <!-- ── MAIN ── -->
    <main>
        <section id="filter">
            <label for="price-filter">Max Price:</label>
            <select id="price-filter">
                <!-- Options will be populated dynamically -->
            </select>
        </section>

        <section id="places-list">
            <!-- List of places will be populated dynamically -->
            
        </section>
    </main>

    <!-- ── FOOTER ── -->
    <footer>
        <p>&copy; 2026 <strong>HBnB</strong> — All rights reserved.</p>
    </footer>

    <script src="../static/scripts.js"></script>
